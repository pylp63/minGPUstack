<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部署向导</title>
<style>
  :root {
    --fg:#1f2328; --muted:#656d76; --border:#d0d7de; --bg:#f6f8fa;
    --card:#fff; --accent:#1677ff; --ok:#1a7f37; --err:#cf222e;
    --radius:10px;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         color:var(--fg); background:var(--bg); font-size:14px; }
  main { max-width:1080px; margin:0 auto; padding:24px 20px 60px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); margin-bottom:20px; }
  .steps { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .step { padding:6px 14px; border-radius:999px; border:1px solid var(--border);
          background:var(--card); color:var(--muted); font-size:13px; }
  .step.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .step.done { color:var(--ok); border-color:var(--ok); }
  .card { background:var(--card); border:1px solid var(--border);
          border-radius:var(--radius); padding:18px 20px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .row:last-child { margin-bottom:0; }
  label { font-size:13px; color:var(--muted); min-width:120px; }
  input, select, textarea {
    padding:7px 10px; border:1px solid var(--border); border-radius:8px;
    font-size:14px; background:#fff; color:var(--fg); outline:none; }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); }
  .grow { flex:1; min-width:180px; }
  button { padding:7px 16px; border-radius:8px; border:1px solid var(--border);
           background:var(--card); cursor:pointer; font-size:14px; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .hidden { display:none; }
  .arch-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; }
  .arch-opt { border:1px solid var(--border); border-radius:var(--radius); padding:12px;
              cursor:pointer; background:#fff; }
  .arch-opt b { display:block; margin-bottom:4px; }
  .arch-opt span { font-size:12px; color:var(--muted); }
  .arch-opt.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:500; }
  pre { background:var(--bg); border:1px solid var(--border); border-radius:8px;
        padding:12px; overflow:auto; max-height:340px; font-size:12.5px; white-space:pre-wrap; }
  .topo { display:flex; gap:14px; overflow-x:auto; padding:8px 2px; }
  .topo-role { min-width:150px; border:1px solid var(--border); border-radius:var(--radius);
               background:#fff; padding:10px 12px; position:relative; }
  .topo-role .role { font-weight:600; color:var(--accent); font-size:13px; }
  .topo-role .nm { font-size:13px; margin:2px 0 6px; }
  .topo-role .kv { font-size:12px; color:var(--muted); line-height:1.6; }
  .arrow { align-self:center; color:var(--muted); }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:26px;
           background:#24292f; color:#fff; border-radius:8px; padding:10px 18px;
           font-size:13px; z-index:9; }
  .empty { color:var(--muted); padding:8px 0; }
  .nav { display:flex; justify-content:space-between; margin-top:6px; }
</style>
</head>
<body>
<main>
  <h1>部署向导</h1>
  <div class="sub">选模型 → 选引擎 → 选服务形态 → 选节点/角色 → 配副本 → 环境变量 → 预览拓扑与 YAML → 一键部署</div>

  <div class="steps" id="steps">
    <span class="step on" data-s="1">1 模型</span>
    <span class="step" data-s="2">2 引擎</span>
    <span class="step" data-s="3">3 服务形态</span>
    <span class="step" data-s="4">4 节点/角色</span>
    <span class="step" data-s="5">5 副本</span>
    <span class="step" data-s="6">6 环境变量</span>
    <span class="step" data-s="7">7 预览</span>
  </div>

  <!-- 步骤 1: 模型 -->
  <div class="card" id="s1">
    <h2>选择模型</h2>
    <div class="row">
      <label>模型来源</label>
      <select id="w-source" class="grow">
        <option value="huggingface">HuggingFace</option>
        <option value="model_scope">ModelScope</option>
        <option value="local_path">本地路径</option>
      </select>
    </div>
    <div class="row">
      <label>模型标识</label>
      <input id="w-model" class="grow" placeholder="如 Qwen/Qwen2.5-0.5B-Instruct">
    </div>
    <div class="row">
      <label>部署名称</label>
      <input id="w-name" class="grow" placeholder="如 qwen25 (英文, 用于路由)">
    </div>
  </div>

  <!-- 步骤 2: 引擎 -->
  <div class="card" id="s2">
    <h2>选择推理引擎</h2>
    <div class="row">
      <select id="w-backend" class="grow">
        <option value="">跟随集群默认</option>
        <option value="vllm">vLLM</option>
        <option value="sglang">SGLang</option>
        <option value="llama-box">llama-box</option>
        <option value="vox-box">vox-box</option>
      </select>
    </div>
  </div>

  <!-- 步骤 3: 服务形态 -->
  <div class="card" id="s3">
    <h2>选择服务形态</h2>
    <div class="arch-grid" id="arch-grid"></div>
  </div>

  <!-- 步骤 4: 节点/角色 (随形态动态) -->
  <div class="card" id="s4">
    <h2>节点 / 角色配置</h2>
    <div id="role-cfg"></div>
  </div>

  <!-- 步骤 5: 副本 -->
  <div class="card" id="s5">
    <h2>副本配置</h2>
    <div id="replica-cfg"></div>
  </div>

  <!-- 步骤 6: 环境变量 -->
  <div class="card" id="s6">
    <h2>环境变量 (高级)</h2>
    <div class="row">
      <textarea id="w-env" class="grow" rows="4" placeholder="每行一个 KEY=VALUE, 如&#10;VLLM_LOGGING_LEVEL=INFO"></textarea>
    </div>
    <div class="row">
      <label style="min-width:auto"><input type="checkbox" id="w-kv"> 启用 KV 传输 (KV-aware 路由, PD 形态)</label>
    </div>
  </div>

  <!-- 步骤 7: 预览 -->
  <div class="card" id="s7">
    <h2>部署计划预览</h2>
    <div class="topo" id="topo"></div>
    <table id="plan-tbl">
      <thead><tr><th>角色</th><th>节点</th><th>每节点 GPU</th><th>TP</th><th>副本</th><th>端口</th><th>环境变量</th><th>启动命令</th><th>依赖</th></tr></thead>
      <tbody></tbody>
    </table>
    <h2 style="margin-top:16px">YAML</h2>
    <pre id="yaml-out">填写上方配置后自动生成。</pre>
    <div class="nav">
      <button onclick="genPreview()">刷新预览</button>
      <div>
        <button onclick="downloadYaml()">下载 YAML</button>
        <button class="primary" id="btn-deploy" onclick="doDeploy()">一键部署</button>
      </div>
    </div>
  </div>

  <div class="nav">
    <button onclick="step(-1)">上一步</button>
    <button class="primary" onclick="step(1)">下一步</button>
  </div>
</main>

<script>
const API = '/v2';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let CUR = 1;
let ARCH = 'standalone';
let PREVIEW = null;

const ARCHS = [
  { id:'standalone',       name:'单机多卡',     desc:'单节点 TP 多卡, 支持多实例' },
  { id:'pipeline_parallel',name:'多机流水线',   desc:'N 节点 N 个 PP stage, 每 stage 可配 TP' },
  { id:'pd_disaggregated', name:'PD 分离',      desc:'Prefill / Decode 独立节点组 + Router' },
  { id:'multi_pd',         name:'多 P 多 D',    desc:'P/D 各多副本, Router 多副本, KV 传输' },
];

function renderArch() {
  $('#arch-grid').innerHTML = ARCHS.map(a => `
    <div class="arch-opt ${a.id===ARCH?'on':''}" onclick="pickArch('${a.id}')">
      <b>${a.name}</b><span>${a.desc}</span>
    </div>`).join('');
}

function pickArch(id) { ARCH = id; renderArch(); renderRoleCfg(); renderReplicaCfg(); }

function renderRoleCfg() {
  let h = '';
  if (ARCH === 'standalone') {
    h = `<div class="row"><label>每实例 GPU 数 (TP)</label>
         <input id="r-tp" type="number" value="1" min="1" max="64" style="width:110px"></div>`;
  } else if (ARCH === 'pipeline_parallel') {
    h = `<div class="row"><label>PP 节点数 (stage 数)</label>
         <input id="r-pp" type="number" value="2" min="2" max="64" style="width:110px"></div>
         <div class="row"><label>每 stage TP</label>
         <input id="r-tp" type="number" value="1" min="1" max="64" style="width:110px"></div>`;
  } else if (ARCH === 'pd_disaggregated' || ARCH === 'multi_pd') {
    h = `<div class="row"><label>P (prefill) 每副本 GPU</label>
         <input id="r-pgpu" type="number" value="1" min="1" max="64" style="width:110px"></div>
         <div class="row"><label>D (decode) 每副本 GPU</label>
         <input id="r-dgpu" type="number" value="1" min="1" max="64" style="width:110px"></div>
         <div class="row"><label>Router</label>
         <span class="sub" style="margin:0">同 owner 模型名自动聚合路由 (model-route), 无需单独占 GPU</span></div>`;
  }
  $('#role-cfg').innerHTML = h;
}

function renderReplicaCfg() {
  let h = '';
  if (ARCH === 'standalone') {
    h = `<div class="row"><label>实例副本数</label>
         <input id="c-replicas" type="number" value="1" min="1" max="64" style="width:110px"></div>`;
  } else if (ARCH === 'pipeline_parallel') {
    h = `<div class="empty">流水线为单部署跨节点, 副本数固定 1。</div>`;
  } else {
    h = `<div class="row"><label>P 副本数</label>
         <input id="c-prep" type="number" value="1" min="1" max="64" style="width:110px"></div>
         <div class="row"><label>D 副本数</label>
         <input id="c-drep" type="number" value="1" min="1" max="64" style="width:110px"></div>
         <div class="row"><label>Router 副本数</label>
         <input id="c-rrep" type="number" value="1" min="1" max="64" style="width:110px"></div>`;
  }
  $('#replica-cfg').innerHTML = h;
}

function step(d) {
  CUR = Math.max(1, Math.min(7, CUR + d));
  for (let i = 1; i <= 7; i++) {
    const el = $('#s' + i);
    if (el) el.style.display = i <= CUR ? '' : 'none';
    const st = document.querySelector(`.step[data-s="${i}"]`);
    if (st) { st.className = 'step' + (i === CUR ? ' on' : i < CUR ? ' done' : ''); }
  }
  if (CUR === 7) genPreview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function buildReq() {
  const req = {
    architecture: ARCH,
    model_name: $('#w-name').value.trim() || 'model',
    model_source: $('#w-model').value.trim() || 'Qwen/Qwen2.5-0.5B-Instruct',
    model_source_kind: $('#w-source').value,
  };
  const backend = $('#w-backend').value;
  if (backend) req.backend = backend;
  const env = {};
  ($('#w-env').value || '').split('\n').forEach(l => {
    const i = l.indexOf('=');
    if (i > 0) env[l.slice(0, i).trim()] = l.slice(i + 1).trim();
  });
  if (Object.keys(env).length) req.env = env;
  req.kv_transfer = $('#w-kv').checked;
  const num = (id, dflt) => { const el = $(id); return el ? Math.max(1, parseInt(el.value) || dflt) : dflt; };
  if (ARCH === 'standalone') {
    req.tensor_parallel_size = num('#r-tp', 1);
    req.replicas = num('#c-replicas', 1);
  } else if (ARCH === 'pipeline_parallel') {
    req.pipeline_parallel_size = num('#r-pp', 2);
    req.tensor_parallel_size = num('#r-tp', 1);
  } else {
    req.prefill_gpu_count = num('#r-pgpu', 1);
    req.decode_gpu_count = num('#r-dgpu', 1);
    req.prefill_replicas = num('#c-prep', 1);
    req.decode_replicas = num('#c-drep', 1);
    req.router_replicas = num('#c-rrep', 1);
  }
  return req;
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' }, ...opts });
  if (res.status === 401) { top.location.href = '/#/login'; throw new Error('unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || res.statusText);
  return data;
}

async function genPreview() {
  try {
    PREVIEW = await api('/deploy-presets/preview', {
      method: 'POST', body: JSON.stringify(buildReq()) });
    renderPreview();
  } catch (e) { toast('预览失败: ' + e.message); }
}

function renderPreview() {
  if (!PREVIEW) return;
  // 拓扑图 (角色块 + 箭头)
  $('#topo').innerHTML = PREVIEW.roles.map((r, i) => `
    ${i > 0 ? '<span class="arrow">→</span>' : ''}
    <div class="topo-role">
      <div class="role">${esc(r.role)}</div>
      <div class="nm">${esc(r.name)}</div>
      <div class="kv">节点 ×${r.nodes} · GPU/节点 ${r.gpus_per_node}${r.tensor_parallel_size ? ' · TP ' + r.tensor_parallel_size : ''}<br>
      副本 ×${r.replicas} · 端口 ${r.port}${r.depends_on.length ? '<br>依赖: ' + esc(r.depends_on.join(', ')) : ''}</div>
    </div>`).join('');
  // 计划表
  $('#plan-tbl tbody').innerHTML = PREVIEW.roles.map(r => `
    <tr>
      <td><b>${esc(r.role)}</b></td><td>${r.nodes}</td><td>${r.gpus_per_node}</td>
      <td>${r.tensor_parallel_size || '—'}</td><td>${r.replicas}</td><td>${r.port}</td>
      <td>${Object.keys(r.env||{}).length ? esc(JSON.stringify(r.env)) : '—'}</td>
      <td style="max-width:260px"><code>${esc(r.command)}</code></td>
      <td>${esc((r.depends_on||[]).join(', ') || '—')}</td>
    </tr>`).join('');
  $('#yaml-out').textContent = PREVIEW.plan_yaml || '(空)';
}

function downloadYaml() {
  if (!PREVIEW) { toast('先刷新预览'); return; }
  const blob = new Blob([PREVIEW.plan_yaml], { type: 'text/yaml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (buildReq().model_name || 'deploy') + '-plan.yaml';
  a.click();
}

async function doDeploy() {
  const btn = $('#btn-deploy');
  btn.disabled = true; btn.textContent = '部署中…';
  try {
    await api('/deploy-presets/deploy', {
      method: 'POST', body: JSON.stringify(buildReq()) });
    toast('部署已提交, 可在「部署」页查看实例状态');
  } catch (e) { toast('部署失败: ' + e.message); }
  btn.disabled = false; btn.textContent = '一键部署';
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// embed 模式 (iframe 嵌入主界面): 隐藏页头, 融合布局
const qs = new URLSearchParams(location.search);
if (qs.get('embed') === '1') {
  document.querySelector('h1').style.display = 'none';
  document.querySelector('.sub').style.display = 'none';
  document.querySelector('main').style.padding = '10px 14px 40px';
}

renderArch(); renderRoleCfg(); renderReplicaCfg(); step(0);
</script>
</body>
</html>
