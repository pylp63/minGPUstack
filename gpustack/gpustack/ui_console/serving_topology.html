<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服务拓扑</title>
<style>
  :root { --fg:#1f2328; --muted:#59636e; --bd:#d1d9e0; --card:#f6f8fa; --ok:#1a7f37; --warn:#9a6700; --err:#cf222e; --acc:#0969da; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--fg); font-size:14px; }
  main { padding:20px 24px 60px; max-width:1080px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); margin-bottom:18px; font-size:13px; }
  section.card { border:1px solid var(--bd); border-radius:10px; padding:16px 18px; margin-bottom:16px; background:#fff; }
  .card h2 { font-size:15px; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  .card h2 .n { display:inline-flex; width:22px; height:22px; border-radius:50%; background:var(--acc); color:#fff; align-items:center; justify-content:center; font-size:12px; }
  .row { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; }
  .f { display:flex; flex-direction:column; gap:4px; }
  .f label { font-size:12px; color:var(--muted); }
  select, input[type=number], input[type=text] { padding:6px 8px; border:1px solid var(--bd); border-radius:6px; font-size:13px; min-width:150px; background:#fff; }
  .hint { font-size:12px; color:var(--muted); margin-top:10px; line-height:1.6; }
  .pd-groups { display:flex; gap:14px; flex-wrap:wrap; margin-top:6px; }
  .pd-side { flex:1; min-width:330px; border:1px solid var(--bd); border-radius:8px; padding:12px 14px; background:var(--card); }
  .pd-side h3 { margin:0 0 8px; font-size:13px; display:flex; justify-content:space-between; align-items:center; }
  .pd-side h3 .ops button { margin-left:4px; }
  button { padding:5px 12px; border:1px solid var(--bd); border-radius:6px; background:#fff; cursor:pointer; font-size:13px; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button:hover { filter:brightness(.97); }
  .stat { font-size:12px; line-height:1.9; font-family:ui-monospace,Consolas,monospace; white-space:pre; margin:0; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .err { color:var(--err); }
  .notice { font-size:12px; border-left:3px solid var(--warn); background:#fff8c5; padding:6px 10px; border-radius:0 6px 6px 0; margin-top:8px; }
  .notice.err { border-color:var(--err); background:#ffebe9; }
  .actions { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .switch { display:flex; align-items:center; gap:8px; }
  .kbox { border:1px dashed var(--bd); border-radius:8px; padding:10px 12px; margin-top:10px; background:#fff; }
  .kbox .mono { font-family:ui-monospace,Consolas,monospace; font-size:12px; white-space:pre-wrap; color:var(--muted); max-height:240px; overflow:auto; }
  .toolbar { display:flex; gap:10px; margin-top:4px; }
  .hidden { display:none; }
  .badge { font-size:11px; padding:1px 8px; border-radius:10px; border:1px solid var(--bd); color:var(--muted); }
  .badge.on { border-color:var(--ok); color:var(--ok); }
</style>
</head>
<body>
<main>
  <h1>服务拓扑部署</h1>
  <div class="sub">资源拓扑 → 并行策略 (实例级) → PD 分离 (服务级)。并行策略属于单个模型实例；开启 PD 分离后策略下沉到每个 P/D 组内配置。</div>

  <section class="card">
    <h2><span class="n">1</span>资源拓扑</h2>
    <div class="row">
      <div class="f"><label>部署形态</label>
        <select id="topology">
          <option value="single_node">单机部署</option>
          <option value="single_node_multi_gpu">单机多卡</option>
          <option value="multi_node">多机部署</option>
        </select>
      </div>
      <div class="f"><label>交互模式</label>
        <select id="mode">
          <option value="resource_pool">资源池式（分配机器 → 算组数）</option>
          <option value="declarative">声明式（要组数 → 算机器）</option>
        </select>
      </div>
      <div class="f"><label>每机 GPU 数</label><input type="number" id="gpus-per-node" value="8" min="1" max="64"></div>
    </div>
    <div class="hint" id="topo-hint"></div>
  </section>

  <section class="card" id="sec-parallel">
    <h2><span class="n">2</span>并行策略 <span class="badge" id="parallel-scope">单一实例</span></h2>
    <div id="parallel-holder"></div>
  </section>

  <section class="card">
    <h2><span class="n">3</span>PD 分离 <span class="badge" id="pd-badge">关闭</span></h2>
    <div class="switch">
      <input type="checkbox" id="pd-enabled">
      <label for="pd-enabled" style="margin:0">开启 PD 分离（默认 1P1D；P/D 组数量可自定义，每组独立配置组内拓扑与并行策略）</label>
    </div>
    <div id="pd-groups" class="pd-groups hidden"></div>
    <div id="pd-single-holder"></div>
  </section>

  <section class="card">
    <h2><span class="n">4</span>部署</h2>
    <div class="row">
      <div class="f"><label>模型名</label><input type="text" id="w-name" value="my-model"></div>
      <div class="f"><label>模型来源 (HF repo / 本地路径)</label><input type="text" id="w-model" value="Qwen/Qwen2.5-0.5B-Instruct" style="min-width:300px"></div>
      <div class="f"><label>来源类型</label>
        <select id="w-source"><option value="huggingface">HuggingFace</option><option value="model_scope">ModelScope</option><option value="local_path">本地路径</option></select>
      </div>
      <div class="f"><label>推理引擎</label>
        <select id="w-backend"><option value="">默认</option><option value="vllm">vLLM</option><option value="sglang">SGLang</option></select>
      </div>
    </div>
    <div class="toolbar" style="margin-top:14px">
      <button class="primary" id="btn-deploy">生成部署计划并部署</button>
      <button id="btn-plan">仅预览计划</button>
    </div>
    <div class="kbox"><div class="mono" id="plan-out">（尚未生成）</div></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const API = '/v2/serving-topology';

const state = {
  topology: 'single_node_multi_gpu',
  mode: 'resource_pool',
  pd: false,
  pGroups: 1, dGroups: 1,
  singlePar: { tp:1, pp:1, ep:1, dp:1, machines:1 },
  pPar: { tp:1, pp:1, ep:1, dp:1 },
  dPar: { tp:1, pp:1, ep:1, dp:1 },
  pMachines: 1, dMachines: 1,
};

function num(v, d=1){ const n = parseInt(v); return isNaN(n)||n<1 ? d : n; }

function parallelFields(side, editable) {
  const p = state[side];
  return `
  <div class="row">
    <div class="f"><label>TP 张量并行</label><input type="number" min="1" max="64" value="${p.tp}" ${editable?`oninput="upd('${side}','tp',this.value)"`:'disabled'}></div>
    <div class="f"><label>PP 流水线并行 <span style="color:var(--muted)">(组内跨机切分)</span></label><input type="number" min="1" max="64" value="${p.pp}" ${editable?`oninput="upd('${side}','pp',this.value)"`:'disabled'}></div>
    <div class="f"><label>EP 专家并行</label><input type="number" min="1" max="64" value="${p.ep}" ${editable?`oninput="upd('${side}','ep',this.value)"`:'disabled'}></div>
    <div class="f"><label>DP 复用 <span style="color:var(--muted)">(单机多实例, 默认关)</span></label><input type="number" min="1" max="16" value="${p.dp}" ${editable?`oninput="upd('${side}','dp',this.value)"`:'disabled'}></div>
    ${state.mode==='resource_pool' ? `
    <div class="f"><label>分配机器数</label><input type="number" min="1" max="256" value="${state[side+'Machines']||1}" ${editable?`oninput="updM('${side}',this.value)"`:'disabled'}></div>`:''}
  </div>`;
}

function render() {
  $('topology').value = state.topology;
  $('mode').value = state.mode;
  $('pd-enabled').checked = state.pd;
  $('pd-badge').textContent = state.pd ? `开启 · ${state.pGroups}P${state.dGroups}D` : '关闭';
  $('pd-badge').className = 'badge' + (state.pd ? ' on' : '');

  // PD 关: 顶层展示并行策略; PD 开: 下沉到组卡片
  const singleHolder = $('pd-single-holder');
  const groupsHolder = $('pd-groups');
  if (!state.pd) {
    singleHolder.innerHTML = parallelFields('singlePar', true) + `
      <div class="hint">TP × PP × EP = ${state.singlePar.tp*state.singlePar.pp*state.singlePar.ep} 卡 / 实例 · DP 副本 ×${state.singlePar.dp}</div>`;
    singleHolder.classList.remove('hidden');
    groupsHolder.classList.add('hidden');
    $('parallel-holder').innerHTML = '';
    $('sec-parallel').classList.add('hidden');
  } else {
    singleHolder.classList.add('hidden');
    groupsHolder.classList.remove('hidden');
    $('sec-parallel').classList.add('hidden');
    groupsHolder.innerHTML = sideCard('P', 'pPar', state.pGroups, 'pMachines') +
                             sideCard('D', 'dPar', state.dGroups, 'dMachines');
  }
  renderHint();
}

function sideCard(letter, parKey, groups, machKey) {
  const p = state[parKey];
  const gpn = num($('gpus-per-node').value, 8);
  const gpus = p.tp*p.pp*p.ep;
  const mpg = Math.ceil(gpus/gpn);
  const cross = gpus > gpn;
  return `
  <div class="pd-side">
    <h3><span>${letter==='P'?'Prefill 组':'Decode 组'} × ${groups}</span>
      <span class="ops">
        <button onclick="bump('${letter}',-1)">−</button>
        <button onclick="bump('${letter}',1)">+</button>
      </span></h3>
    ${parallelFields(parKey, true)}
    <div class="stat">单组 ${gpus} 卡 · ${cross?`跨 ${mpg} 台机 (PP 跨机)`:'单机内 (含单机内 PP)'}
${state.mode==='resource_pool' ? `可形成 ${Math.floor((state[machKey]||1)/mpg)} 组 · 剩余 ${(state[machKey]||1)%mpg} 台` : `需要 ${groups*mpg} 台机`}</div>
  </div>`;
}

function bump(letter, d) {
  if (letter==='P') state.pGroups = Math.max(1, state.pGroups+d);
  else state.dGroups = Math.max(1, state.dGroups+d);
  render();
}
function upd(side, k, v){ state[side][k] = num(v, 1); render(); }
function updM(side, v){ state[side+'Machines'] = num(v, 1); render(); }

function renderHint() {
  const gpn = num($('gpus-per-node').value, 8);
  const p = state.pd ? state.pPar : state.singlePar;
  const gpus = p.tp*p.pp*p.ep;
  let h = `每机 ${gpn} 卡。`;
  if (gpus > gpn && state.topology === 'single_node_multi_gpu') {
    h += ` ⚠️ 当前实例需 ${gpus} 卡, 超过单机 ${gpn} 卡 — 建议「多机部署」(单组跨 ${Math.ceil(gpus/gpn)} 台机), 已配置的并行策略保持不变。`;
  }
  $('topo-hint').textContent = h;
}

function buildReq() {
  const gpn = num($('gpus-per-node').value, 8);
  const req = {
    model_name: $('w-name').value.trim() || 'model',
    model_source: $('w-model').value.trim(),
    model_source_kind: $('w-source').value,
    topology: state.topology,
    mode: state.mode,
    enabled: state.pd,
  };
  if ($('w-backend').value) req.backend = $('w-backend').value;
  const par = k => ({tensor_parallel_size:k.tp, pipeline_parallel_size:k.pp,
                     expert_parallel_size:k.ep, data_parallel_replicas:k.dp});
  const pool = m => ({machines_allocated:m, gpus_per_node:gpn});
  if (state.pd) {
    req.prefill_groups = state.pGroups;
    req.decode_groups = state.dGroups;
    req.prefill_parallel = par(state.pPar);
    req.decode_parallel = par(state.dPar);
    req.prefill_pool = pool(state.pMachines);
    req.decode_pool = pool(state.dMachines);
  } else {
    req.prefill_parallel = par(state.singlePar);
    req.prefill_pool = pool(state.singlePar.machines);
  }
  return req;
}

async function api(path, opts={}) {
  const res = await fetch(API + path, { credentials:'same-origin',
    headers:{'Content-Type':'application/json'}, ...opts });
  if (res.status === 401) { top.location.href = '/#/login'; throw new Error('unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || res.statusText);
  return data;
}

function fmtPlan(d) {
  const side = (name, s) => {
    if (!s) return '';
    let out = `${name}: ${s.groups_formed} 组 · 占机 ${s.machines_used} · 闲置 ${s.machines_idle} 台 · GPU 用/闲 ${s.gpus_used}/${s.gpus_idle}`;
    if (s.instances_per_machine > 1) out += ` · DP ${s.instances_per_machine} 副本/机`;
    if (s.cross_machine) out += ` · 单组跨 ${s.machines_per_group} 台机`;
    return out + '\n';
  };
  let out = `拓扑: ${d.topology} · PD 分离: ${d.pd_disaggregation ? '开' : '关'}\n`;
  out += side('Single', d.single) + side('Prefill', d.prefill) + side('Decode', d.decode);
  (d.payloads||[]).forEach(p => {
    out += `  · ${p.name}  replicas=${p.replicas}  ${JSON.stringify(p.backend_parameters||[])}\n`;
  });
  if (d.upgrade_hint) out += `⚠️ ${d.upgrade_hint}\n`;
  return out;
}

async function run(deploy) {
  const out = $('plan-out');
  out.textContent = '请求中…';
  try {
    const d = await api(deploy ? '/deploy' : '/plan', { method:'POST', body: JSON.stringify(buildReq()) });
    out.textContent = fmtPlan(d);
    if (d.created_models) out.textContent += `\n✅ 已创建: ${d.created_models.map(m=>m.name).join(', ')}`;
  } catch (e) {
    out.textContent = '❌ ' + e.message;
  }
}

$('topology').onchange = e => { state.topology = e.target.value; render(); };
$('mode').onchange = e => { state.mode = e.target.value; render(); };
$('gpus-per-node').oninput = render;
$('pd-enabled').onchange = e => { state.pd = e.target.checked; render(); };
$('btn-plan').onclick = () => run(false);
$('btn-deploy').onclick = () => run(true);

const qs = new URLSearchParams(location.search);
if (qs.get('embed') === '1') {
  document.querySelector('h1').style.display = 'none';
  document.querySelector('.sub').style.display = 'none';
  main.style.paddingTop = '8px';
}
render();
</script>
</body>
</html>
