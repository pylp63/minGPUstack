<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSH - GPUStack</title>
<link rel="stylesheet" href="/console/xterm.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1e1e1e; overflow: hidden; }
  .bar {
    height: 42px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; background: #252526; border-bottom: 1px solid #333;
    font: 12px/1.4 -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    color: #9aa0a6; box-sizing: border-box;
  }
  .bar .name { color: #e6e6e6; font-weight: 500; font-size: 13px; }
  .bar .meta { flex: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #4caf50; }
  .dot.err { background: #f44336; }
  .dot.wait { background: #ff9800; }
  a.hint { color: #4f8cff; text-decoration: none; cursor: pointer; }

  .main { display: flex; height: calc(100% - 42px); }
  #term { flex: 1; min-width: 0; }

  /* ---------- 文件浏览器侧栏 (可折叠) ---------- */
  #files {
    width: 0; overflow: hidden; transition: width .18s ease;
    background: #212121; border-right: 1px solid #333;
    display: flex; flex-direction: column;
    font: 12px/1.5 -apple-system, "Segoe UI", "PingFang SC", sans-serif;
  }
  #files.open { width: 300px; }
  .fbar {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-bottom: 1px solid #333; flex-shrink: 0;
  }
  .fbar a { color: #4f8cff; text-decoration: none; cursor: pointer; font-size: 12px; }
  .fbar .cur { flex: 1; color: #e6e6e6; font-family: Menlo, Consolas, monospace;
    font-size: 11px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    direction: rtl; text-align: left; }  /* rtl: 长路径显示尾部 (当前目录) */
  .flist { flex: 1; overflow-y: auto; }
  .flist .item {
    display: flex; align-items: center; gap: 8px; padding: 4px 10px;
    cursor: pointer; color: #ccc; font-family: Menlo, Consolas, monospace; font-size: 12px;
  }
  .flist .item:hover { background: #2a2d2e; }
  .flist .item .ico { width: 16px; text-align: center; flex-shrink: 0; }
  .flist .item.dir .name { color: #4f8cff; }
  .flist .item .name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .flist .item .meta { color: #6a6f75; font-size: 10px; flex-shrink: 0; }
  .flist .item .act { opacity: 0; flex-shrink: 0; }
  .flist .item:hover .act { opacity: 1; }
  .flist .item .act a { color: #9aa0a6; cursor: pointer; margin-left: 6px; text-decoration: none; }
  .flist .item .act a:hover { color: #4f8cff; }
  .flist .empty { padding: 16px; color: #6a6f75; }
  .floading { padding: 12px; color: #6a6f75; }
  #upfile { display: none; }

  /* ---------- 凭据弹窗 ---------- */
  #cred-mask { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; }
  #cred-mask.show { display: flex; }
  .dlg { width: 420px; background: #252526; border: 1px solid #3c3c3c; border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.5); font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
  .dlg h3 { margin: 0; padding: 14px 18px; font-size: 15px; color: #e6e6e6; border-bottom: 1px solid #3c3c3c; font-weight: 600; }
  .dlg .body { padding: 14px 18px; }
  .dlg p.tip { margin: 0 0 12px; font-size: 12px; color: #9aa0a6; line-height: 1.6; }
  .dlg label { display: block; font-size: 12px; color: #bbb; margin: 10px 0 4px; }
  .dlg input { width: 100%; box-sizing: border-box; padding: 7px 10px; background: #1e1e1e; border: 1px solid #3c3c3c; border-radius: 6px; color: #e6e6e6; font-size: 13px; outline: none; }
  .dlg input:focus { border-color: #4f8cff; }
  .dlg .err-msg { display: none; margin: 12px 0 0; padding: 8px 10px; border-radius: 6px; font-size: 12px; line-height: 1.5; }
  .dlg .err-msg.show { display: block; }
  .dlg .err-msg.unreachable { background: rgba(255,152,0,.12); color: #ffb74d; }
  .dlg .err-msg.auth_failed { background: rgba(244,67,54,.12); color: #ef9a9a; }
  .dlg .err-msg.other { background: rgba(158,158,158,.12); color: #bdbdbd; }
  .dlg .foot { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 18px; border-top: 1px solid #3c3c3c; }
  .dlg button { padding: 6px 16px; border-radius: 6px; border: 1px solid #3c3c3c; background: #2d2d2d; color: #ccc; font-size: 13px; cursor: pointer; }
  .dlg button.primary { background: #4f8cff; border-color: #4f8cff; color: #fff; }
  .dlg button.primary:disabled { opacity: .55; cursor: not-allowed; }

  #xfer { display: none; margin: 4px 14px; height: 3px; background: #333; border-radius: 2px; overflow: hidden; flex-shrink: 0; }
  #xfer .bar2 { height: 100%; width: 0; background: #4f8cff; transition: width .15s; }
</style>
</head>
<body>
<div class="bar">
  <span class="dot wait" id="dot"></span>
  <span class="name" id="wname">SSH</span>
  <span class="meta" id="wmeta">连接中…</span>
  <a class="hint" id="files-toggle" onclick="toggleFiles()">📁 文件</a>
  <a class="hint" onclick="pickUpload()">⬆ 上传</a>
  <a class="hint" onclick="promptDownload()">⬇ 下载</a>
  <a class="hint" onclick="location.reload()">重新连接</a>
  <input type="file" id="up-file" style="display:none" onchange="doUpload(this)">
</div>
<div id="xfer"><div class="bar2"></div></div>
<div class="main">
  <div id="files">
    <div class="fbar">
      <a onclick="filesUp()" title="上一级">↑</a>
      <span class="cur" id="files-path">/</span>
      <a onclick="filesRefresh()" title="刷新">⟳</a>
      <a onclick="filesUploadHere()" title="上传到当前目录">⬆</a>
    </div>
    <div class="flist" id="files-list"><div class="floading">点击「📁 文件」打开浏览器</div></div>
  </div>
  <div id="term"></div>
</div>

<!-- SSH 凭据弹窗 -->
<div id="cred-mask">
  <div class="dlg">
    <h3 id="dlg-title">连接到节点</h3>
    <div class="body">
      <p class="tip" id="dlg-tip">该节点由集群自动发现, 需要输入 SSH 登录凭据。
        凭据经实际登录验证后保存, 下次连接免输入。</p>
      <label>用户名</label>
      <input id="cred-user" value="root" autocomplete="off">
      <label>密码</label>
      <input id="cred-pass" type="password" autocomplete="off" placeholder="节点 SSH 登录密码">
      <label>SSH 端口</label>
      <input id="cred-port" type="number" value="22" min="1" max="65535">
      <div class="err-msg" id="cred-err"></div>
    </div>
    <div class="foot">
      <button onclick="closeCredDlg(true)">取消</button>
      <button class="primary" id="cred-ok" onclick="submitCredentials()">验证并连接</button>
    </div>
  </div>
</div>

<script src="/console/xterm.js"></script>
<script src="/console/xterm-addon-fit.js"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var workerId = parseInt(qs.get('id'), 10);
  var $ = function (s) { return document.querySelector(s); };
  var term, fit, connected = false;
  var hasCred = false;   // 凭据就绪 (终端连上) 后文件浏览器才可用

  function setDot(cls, msg) {
    $('#dot').className = 'dot ' + cls;
    $('#wmeta').textContent = msg;
  }

  // ================= 凭据弹窗 =================
  function showCredDlg(title, tip) {
    $('#dlg-title').textContent = title || '连接到节点';
    if (tip) $('#dlg-tip').textContent = tip;
    $('#cred-err').className = 'err-msg';
    $('#cred-mask').classList.add('show');
    setTimeout(function () { $('#cred-pass').focus(); }, 50);
  }
  window.closeCredDlg = function (cancelled) {
    $('#cred-mask').classList.remove('show');
    if (cancelled && !connected) {
      setDot('err', '未连接 — 已取消凭据输入');
      term.write('\r\n\x1b[90m[已取消 — 点击「重新连接」重试]\x1b[0m\r\n');
    }
  };

  var ERR_META = {
    no_credentials: { cls: 'other', title: '连接到节点',
      tip: '该节点由集群自动发现, 需要输入 SSH 登录凭据。凭据经实际登录验证后保存, 下次连接免输入。',
      text: '尚未保存该节点的 SSH 凭据', recred: true },
    auth_failed: { cls: 'auth_failed', title: 'SSH 用户名或密码错误',
      tip: '凭据验证未通过, 请重新输入 (保存的旧密码可能已被修改)。',
      text: '用户名或密码错误', recred: true },
    unreachable: { cls: 'unreachable', title: 'SSH 端口不通',
      tip: '无法建立 TCP 连接。请检查: 节点 sshd 是否运行、端口是否正确、防火墙/安全组是否放行。',
      text: 'SSH 端口不通或网络不可达', recred: true },
    ssh_error: { cls: 'other', title: 'SSH 连接失败', text: '', recred: true }
  };

  function handleGwError(code, message) {
    var meta = ERR_META[code] || ERR_META.ssh_error;
    setDot('err', meta.text);
    term.write('\r\n\x1b[31m[' + (message || meta.text) + ']\x1b[0m\r\n');
    if (meta.recred) {
      var err = $('#cred-err');
      err.className = 'err-msg show ' + meta.cls;
      err.textContent = (message || meta.text);
      showCredDlg(meta.title, meta.tip);
      if (code === 'unreachable') setTimeout(function () { $('#cred-port').focus(); }, 60);
      else setTimeout(function () { $('#cred-pass').focus(); }, 60);
    }
  }

  window.submitCredentials = function () {
    var btn = $('#cred-ok');
    var user = $('#cred-user').value.trim();
    var pass = $('#cred-pass').value;
    var port = parseInt($('#cred-port').value, 10) || 22;
    if (!user || !pass) {
      var err = $('#cred-err');
      err.className = 'err-msg show auth_failed';
      err.textContent = '请填写用户名和密码';
      return;
    }
    btn.disabled = true; btn.textContent = '验证中…';
    fetch('/v2/ssh-gw/credentials/' + workerId, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass, port: port })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.ok) {
        $('#cred-mask').classList.remove('show');
        connect();
      } else {
        var meta = ERR_META[j.code] || ERR_META.ssh_error;
        var err = $('#cred-err');
        err.className = 'err-msg show ' + meta.cls;
        err.textContent = j.message || meta.text;
        btn.disabled = false; btn.textContent = '验证并连接';
        $('#cred-pass').select();
      }
    }).catch(function (e) {
      var err = $('#cred-err');
      err.className = 'err-msg show other';
      err.textContent = '请求失败: ' + e.message;
      btn.disabled = false; btn.textContent = '验证并连接';
    });
  };
  $('#cred-pass').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submitCredentials();
  });

  // ================= Tab 补全 =================
  // 输入行缓冲: 跟踪光标前的当前命令行 (回车/输出重置), Tab 时取片段请求补全。
  var lineBuf = '';
  function feedCompletionTracker(data) {
    // 终端输出不含输入回显的结构信息 — 简化: 以最后一次用户输入为准。
  }
  var completing = false;
  function requestCompletion() {
    if (!connected || completing || !lineBuf.trim()) return;
    completing = true;
    fetch('/v2/ssh-gw/complete', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ worker_id: workerId, line: lineBuf, cursor: lineBuf.length })
    }).then(function (r) { return r.json(); }).then(function (j) {
      completing = false;
      var comps = j.completions || [];
      if (!comps.length) return;
      if (comps.length === 1) {
        // 唯一候选: 直接补全 (替换最后一个词)
        applyCompletion(comps[0]);
      } else {
        // 多候选: 终端里列出候选 (灰显), 等再次 Tab 或继续输入
        term.write('\r\n\x1b[90m' + comps.slice(0, 30).join('   ') + '\x1b[0m\r\n');
        // 共同前缀自动补上
        var cp = commonPrefix(comps);
        if (cp && cp.length > lastWord().length) applyCompletion(cp);
      }
    }).catch(function () { completing = false; });
  }
  function lastWord() {
    var m = lineBuf.match(/(\S*)$/);
    return m ? m[1] : '';
  }
  function applyCompletion(word) {
    var lw = lastWord();
    if (word.startsWith(lw)) {
      var add = word.slice(lw.length);
      if (add) { wsSend({ type: 'input', data: add }); lineBuf += add; }
      if (!/\s$/.test(word) && lineBuf.endsWith(word)) { /* keep */ }
    }
  }
  function commonPrefix(arr) {
    if (!arr.length) return '';
    var p = arr[0];
    for (var i = 1; i < arr.length; i++) {
      while (p && arr[i].indexOf(p) !== 0) p = p.slice(0, -1);
    }
    return p;
  }

  // ================= 文件浏览器 =================
  var filesOpen = false, filesPath = '/';
  window.toggleFiles = function () {
    filesOpen = !filesOpen;
    $('#files').className = filesOpen ? 'open' : '';
    if (filesOpen) { if (hasCred) filesLs(filesPath); else filesLs('/'); }
  };
  window.filesRefresh = function () { if (filesOpen) filesLs(filesPath); };
  window.filesUp = function () {
    if (filesPath === '/') return;
    var up = filesPath.replace(/\/+$/, '').split('/');
    up.pop();
    filesLs(up.join('/') || '/');
  };
  window.filesUploadHere = function () {
    $('#up-file').dataset.dest = filesPath;
    $('#up-file').click();
  };
  function filesLs(p) {
    filesPath = p;
    $('#files-path').textContent = p;
    $('#files-path').title = p;
    $('#files-list').innerHTML = '<div class="floading">读取中…</div>';
    fetch('/v2/ssh-gw/ls?worker_id=' + workerId + '&path=' + encodeURIComponent(p),
          { credentials: 'include' })
      .then(function (r) {
        if (!r.ok) return r.json().catch(function () { return {}; })
          .then(function (j) { throw new Error(j.message || ('HTTP ' + r.status)); });
        return r.json();
      })
      .then(function (d) {
        renderFiles(d.items || [], d.path || p);
      })
      .catch(function (e) {
        $('#files-list').innerHTML = '<div class="floading" style="color:#ef9a9a">' + e.message + '</div>';
      });
  }
  function renderFiles(items, path) {
    filesPath = path;
    $('#files-path').textContent = path;
    $('#files-path').title = path;
    var html = items.map(function (it) {
      var full = (path === '/' ? '' : path) + '/' + it.name;
      var esc = String(it.name).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
      if (it.is_dir) {
        return '<div class="item dir" onclick="filesLs(\'' + jsq(full) + '\')">'
          + '<span class="ico">📁</span><span class="name">' + esc + '</span>'
          + '<span class="meta">' + it.mod_time + '</span></div>';
      }
      return '<div class="item">'
        + '<span class="ico">📄</span><span class="name">' + esc + '</span>'
        + '<span class="meta">' + fmtSize(it.size) + '</span>'
        + '<span class="act"><a title="下载" onclick="dlFile(\'' + jsq(full) + '\')">⬇</a></span>'
        + '</div>';
    }).join('');
    $('#files-list').innerHTML = html || '<div class="empty">空目录</div>';
  }
  function jsq(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
  function fmtSize(n) {
    if (n == null) return '';
    if (n > 1048576) return (n / 1048576).toFixed(1) + 'M';
    if (n > 1024) return (n / 1024).toFixed(1) + 'K';
    return n + '';
  }
  window.filesLs = filesLs;
  window.dlFile = function (p) {
    var url = '/v2/ssh-gw/download?worker_id=' + workerId + '&path=' + encodeURIComponent(p);
    fetch(url, { credentials: 'include' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var cd = r.headers.get('content-disposition') || '';
      var name = cd.match(/filename="([^"]+)"/);
      return r.blob().then(function (b) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = name ? name[1] : p.split('/').pop();
        a.click();
        URL.revokeObjectURL(a.href);
      });
    }).catch(function (e) {
      setDot('err', '下载失败');
      term.write('\r\n\x1b[31m[下载失败: ' + e.message + ']\x1b[0m\r\n');
    });
  };

  // ================= 文件传输 =================
  function xferProgress(pct) {
    var box = $('#xfer');
    if (pct === null) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    box.querySelector('.bar2').style.width = Math.min(100, pct) + '%';
  }
  window.pickUpload = function () {
    if (!workerId) return;
    delete $('#up-file').dataset.dest;
    $('#up-file').click();
  };
  window.doUpload = function (inp) {
    var f = inp.files && inp.files[0];
    var dest = inp.dataset.dest;
    inp.value = '';
    if (!f) return;
    var remote = dest || prompt('上传到远程路径 (目录或完整路径):', '/tmp');
    if (remote === null) return;
    var fd = new FormData();
    fd.append('file', f);
    fd.append('worker_id', workerId);
    fd.append('remote_path', remote);
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/v2/ssh-gw/upload');
    xhr.withCredentials = true;
    setDot('wait', '上传中 ' + f.name + ' …');
    xferProgress(3);
    xhr.upload.onprogress = function (e) {
      if (e.lengthComputable) xferProgress(e.loaded / e.total * 100);
    };
    xhr.onload = function () {
      xferProgress(null);
      try {
        var j = JSON.parse(xhr.responseText);
        if (j.ok) {
          setDot('', '已连接 · 上传完成');
          term.write('\r\n\x1b[32m[已上传 ' + j.path + ' (' + j.bytes + ' 字节)]\x1b[0m\r\n');
          term.focus();
          if (filesOpen) filesRefresh();
        } else {
          setDot('err', '上传失败');
          term.write('\r\n\x1b[31m[上传失败: ' + (j.message || xhr.status) + ']\x1b[0m\r\n');
        }
      } catch (e) {
        setDot('err', '上传失败');
        term.write('\r\n\x1b[31m[上传失败: HTTP ' + xhr.status + ']\x1b[0m\r\n');
      }
    };
    xhr.onerror = function () {
      xferProgress(null);
      setDot('err', '上传失败');
      term.write('\r\n\x1b[31m[上传失败: 网络错误]\x1b[0m\r\n');
    };
    xhr.send(fd);
  };

  window.promptDownload = function () {
    if (!workerId) return;
    var p = prompt('要下载的远程文件绝对路径:', '');
    if (!p) return;
    window.dlFile(p);
  };

  // ================= 终端 =================
  term = new Terminal({
    cursorBlink: true, fontSize: 13,
    fontFamily: 'Menlo, Consolas, "Courier New", monospace',
    theme: { background: '#1e1e1e' }, scrollback: 10000
  });
  fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($('#term'));
  fit.fit();

  if (!workerId) {
    setDot('err', '缺少 ?id= 参数');
    term.write('\r\n\x1b[31m[缺少 ?id= 参数]\x1b[0m\r\n');
    return;
  }

  fetch('/v2/workers?perPage=200', { credentials: 'include' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) {
      var w = (d.items || []).find(function (x) { return String(x.id) === String(workerId); });
      if (!w) throw new Error('节点不存在');
      var gpus = ((w.status || {}).gpu_devices || []).length;
      $('#wname').textContent = 'SSH — ' + w.name;
      $('#wmeta').textContent = w.ip + ' · ' + (gpus ? 'GPU 服务器 (' + gpus + ' 卡)' : 'CPU 服务器');
    })
    .catch(function (e) { setDot('err', '节点信息获取失败: ' + e.message); });

  var ws = null;
  function wsSend(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

  function connect() {
    setDot('wait', '连接中…');
    fetch('/v2/ssh-gw/ticket/' + workerId, {
      method: 'POST', credentials: 'include'
    }).then(function (r) {
      if (!r.ok) return r.json().then(function (j) { throw new Error(j.message || ('HTTP ' + r.status)); });
      return r.json();
    }).then(function (d) {
      var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(proto + '//' + location.host + '/v2/ssh-gw/ws?ticket=' + encodeURIComponent(d.ticket));
      ws.binaryType = 'arraybuffer';
      var ping = null;

      ws.onopen = function () {
        setDot('', '已连接');
        term.focus();
        connected = true;
        hasCred = true;
        if (filesOpen) filesLs(filesPath);
        ping = setInterval(function () { wsSend({ type: 'ping' }); }, 15000);
      };
      ws.onmessage = function (ev) {
        if (typeof ev.data === 'string') {
          try {
            var m = JSON.parse(ev.data);
            if (m.type === 'pong') return;
            if (m.type === 'error') { handleGwError(m.code, m.data); return; }
          } catch (e) {}
          return;
        }
        term.write(new Uint8Array(ev.data));
      };
      ws.onclose = function () {
        if (ping) clearInterval(ping);
        connected = false;
        hasCred = false;
        if ($('#cred-mask').classList.contains('show')) return;
        setDot('err', '连接已断开');
        term.write('\r\n\x1b[31m[连接已断开 — 可点「重新连接」]\x1b[0m\r\n');
      };
      ws.onerror = function () {};

      term.onData(function (data) {
        if (ws.readyState !== 1) return;
        // 行缓冲维护 (补全用): 可打印字符追加; 回车/ctrl-c 清空; 退格回退
        if (data === '\r') { lineBuf = ''; }
        else if (data === '\u007f') { lineBuf = lineBuf.slice(0, -1); }
        else if (data === '\u0003') { lineBuf = ''; }
        else if (data === '\t') {
          requestCompletion();  // 不发送 Tab 给 PTY (由补全逻辑决定写什么)
          return;
        }
        else if (data >= ' ') { lineBuf += data; }
        wsSend({ type: 'input', data: data });
      });
      term.onResize(function (cols, rows) {
        wsSend({ type: 'resize', cols: cols, rows: rows });
      });
    }).catch(function (e) {
      setDot('err', '无法建立连接: ' + e.message);
      term.write('\r\n\x1b[31m[无法建立连接: ' + e.message + ']\x1b[0m\r\n');
    });
  }

  window.addEventListener('resize', function () { fit.fit(); });
  connect();
})();
</script>
</body>
</html>
