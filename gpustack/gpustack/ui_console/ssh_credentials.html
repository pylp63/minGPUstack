<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>节点凭证 - GPUStack</title>
<style>
  :root {
    --fg: #e6e6e6; --muted: #9aa0a6; --accent: #4f8cff; --border: #333;
    --bg: #1e1e1e; --card: #252526; --danger: #f44336; --ok: #4caf50;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 13px/1.6 -apple-system, "Segoe UI", "PingFang SC", sans-serif; background: var(--bg); color: var(--fg); padding: 20px; }
  h2 { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 18px; }
  .panel .tip { color: var(--muted); font-size: 12px; margin-bottom: 10px; line-height: 1.7; }

  /* 轮换设置区 */
  .rotate-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rotate-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .switch { position: relative; width: 36px; height: 20px; background: #444; border-radius: 10px; transition: .2s; cursor: pointer; flex-shrink: 0; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #bbb; transition: .2s; }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 18px; background: #fff; }
  .rotate-row input[type=number] {
    width: 70px; padding: 4px 8px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px; font: inherit;
  }
  .btn {
    padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: #2d2d2d; color: var(--fg); font: inherit; cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: #ef9a9a; border-color: #5b2526; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* 凭证表 */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #333; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td .ip { color: var(--accent); }
  td .pw { font-family: Menlo, Consolas, monospace; color: var(--muted); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 11px; }
  .badge.ok { background: rgba(76,175,80,.15); color: #81c784; }
  .badge.none { background: rgba(158,158,158,.15); color: #bdbdbd; }
  .ops { display: flex; gap: 8px; }

  /* 弹窗 */
  #mask { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 10; }
  #mask.show { display: flex; }
  .dlg { width: 420px; background: var(--card); border: 1px solid #3c3c3c; border-radius: 10px; }
  .dlg h3 { padding: 14px 18px; border-bottom: 1px solid #3c3c3c; font-size: 15px; }
  .dlg .body { padding: 14px 18px; }
  .dlg label { display: block; font-size: 12px; color: #bbb; margin: 10px 0 4px; }
  .dlg input {
    width: 100%; padding: 7px 10px; background: var(--bg); border: 1px solid #3c3c3c;
    border-radius: 6px; color: var(--fg); font: inherit; outline: none;
  }
  .dlg input:focus { border-color: var(--accent); }
  .dlg .err { display: none; margin-top: 10px; padding: 8px 10px; border-radius: 6px; font-size: 12px; background: rgba(244,67,54,.12); color: #ef9a9a; }
  .dlg .err.show { display: block; }
  .dlg .foot { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 18px; border-top: 1px solid #3c3c3c; }
  .toast { position: fixed; top: 16px; right: 16px; z-index: 20; padding: 10px 16px; border-radius: 8px; font-size: 13px; display: none; }
  .toast.ok { background: rgba(76,175,80,.15); color: #81c784; border: 1px solid rgba(76,175,80,.4); }
  .toast.err { background: rgba(244,67,54,.15); color: #ef9a9a; border: 1px solid rgba(244,67,54,.4); }
</style>
</head>
<body>
<h2>节点凭证</h2>

<!-- 随机密码轮换设置 -->
<div class="panel">
  <div class="tip">开启后, 网关按设定天数定期把各节点的 SSH 登录密码改为高强度随机密码
    (crypto/rand 32 字符)。轮换后此处保存的凭据自动同步, SSH 终端连接不受影响。</div>
  <div class="rotate-row">
    <label>
      <div class="switch" id="rot-switch" onclick="toggleRotate()"></div>
      <span>定期修改为随机密码</span>
    </label>
    <span>每</span>
    <input type="number" id="rot-days" min="1" max="365" value="7" onchange="markDirty()">
    <span>天</span>
    <button class="btn primary" id="rot-save" onclick="saveRotate()" disabled>保存</button>
    <span id="rot-status" style="color: var(--muted); font-size: 12px;"></span>
  </div>
</div>

<!-- 凭证列表 -->
<div class="panel">
  <div class="tip">集群节点由系统自动发现 (worker 注册), SSH 登录凭据在此集中管理;
    也可在 SSH 终端首次连接时录入。凭据保存前均经实际登录验证。</div>
  <table>
    <thead>
      <tr><th>节点</th><th>IP</th><th>用户名</th><th>端口</th><th>密码</th><th>操作</th></tr>
    </thead>
    <tbody id="cred-tbody">
      <tr><td colspan="6" style="color: var(--muted)">加载中…</td></tr>
    </tbody>
  </table>
</div>

<!-- 录入/编辑弹窗 -->
<div id="mask">
  <div class="dlg">
    <h3 id="dlg-title">节点 SSH 凭据</h3>
    <div class="body">
      <p style="font-size:12px;color:var(--muted);margin-bottom:4px" id="dlg-node"></p>
      <label>用户名</label><input id="f-user" value="root" autocomplete="off">
      <label>密码</label><input id="f-pass" type="password" autocomplete="off" placeholder="SSH 登录密码">
      <label>端口</label><input id="f-port" type="number" value="22" min="1" max="65535">
      <div class="err" id="f-err"></div>
    </div>
    <div class="foot">
      <button class="btn" onclick="closeDlg()">取消</button>
      <button class="btn primary" id="f-ok" onclick="submitCred()">验证并保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var workers = [];           // [{id, name, ip, gpus}]
  var rotateCfg = { enabled: false, days: 7 };

  function toast(msg, ok) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show ' + (ok ? 'ok' : 'err');
    setTimeout(function () { t.className = 'toast'; }, 2600);
  }

  function api(path, opts) {
    return fetch(path, Object.assign({ credentials: 'include' }, opts))
      .then(function (r) {
        if (r.status === 401) { top.location.href = '/#/login'; throw new Error('未登录'); }
        return r.json().then(function (j) {
          if (!r.ok) throw new Error(j.message || ('HTTP ' + r.status));
          return j;
        });
      });
  }

  // ---------- 节点列表 ----------
  function loadWorkers() {
    return api('/v2/workers?perPage=500').then(function (d) {
      workers = (d.items || []).map(function (w) {
        return {
          id: w.id, name: w.name, ip: w.ip,
          gpus: ((w.status || {}).gpu_devices || []).length
        };
      });
    });
  }

  // ---------- 凭据列表 ----------
  function loadCreds() {
    return api('/v2/ssh-gw/credentials').then(function (d) {
      renderTable(d.items || [], d.meta || {});
      if (d.meta && typeof d.meta.rotate_days !== 'undefined') {
        rotateCfg = { enabled: !!d.meta.rotate_enabled, days: d.meta.rotate_days || 7 };
        syncRotateUI(false);
      }
    }).catch(function (e) {
      $('#cred-tbody').innerHTML =
        '<tr><td colspan="6" style="color:#ef9a9a">' + e.message + '</td></tr>';
    });
  }

  function renderTable(creds, meta) {
    var byId = {};
    (creds || []).forEach(function (c) { byId[c.worker_id] = c; });
    var rows = workers.map(function (w) {
      var c = byId[w.id];
      if (c) {
        return '<tr>'
          + '<td>' + esc(w.name) + (w.gpus ? ' <span style="color:#4f8cff;font-size:11px">GPU×' + w.gpus + '</span>' : '') + '</td>'
          + '<td class="ip">' + esc(c.ip) + '</td>'
          + '<td>' + esc(c.username) + '</td>'
          + '<td>' + c.port + '</td>'
          + '<td class="pw">•••••••• <span class="badge ok">已保存</span>'
          + (c.rotated_at ? ' <span style="font-size:11px;color:var(--muted)">轮换于 ' + c.rotated_at.slice(0, 16).replace('T', ' ') + '</span>' : '')
          + '</td>'
          + '<td class="ops">'
          + '<button class="btn" onclick="editCred(' + w.id + ')">修改</button>'
          + '<button class="btn danger" onclick="delCred(' + w.id + ',\'' + esc(w.name) + '\')">删除</button>'
          + '</td></tr>';
      }
      return '<tr>'
        + '<td>' + esc(w.name) + '</td>'
        + '<td class="ip">' + esc(w.ip || '-') + '</td>'
        + '<td colspan="3"><span class="badge none">未配置</span></td>'
        + '<td class="ops"><button class="btn" onclick="editCred(' + w.id + ')">配置</button></td>'
        + '</tr>';
    });
    $('#cred-tbody').innerHTML = rows.join('') ||
      '<tr><td colspan="6" style="color:var(--muted)">暂无节点</td></tr>';
  }

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---------- 轮换设置 ----------
  window.toggleRotate = function () {
    rotateCfg.enabled = !rotateCfg.enabled;
    syncRotateUI(true);
  };
  window.markDirty = function () { syncRotateUI(true); };
  function syncRotateUI(dirty) {
    $('#rot-switch').className = 'switch' + (rotateCfg.enabled ? ' on' : '');
    $('#rot-days').value = rotateCfg.days;
    $('#rot-days').disabled = !rotateCfg.enabled;
    $('#rot-save').disabled = !dirty;
  }
  window.saveRotate = function () {
    var days = parseInt($('#rot-days').value, 10) || 7;
    $('#rot-save').disabled = true;
    api('/v2/ssh-gw/rotate-config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: rotateCfg.enabled, days: days })
    }).then(function (d) {
      rotateCfg = { enabled: !!d.enabled, days: d.days };
      syncRotateUI(false);
      toast(d.enabled ? ('已开启: 每 ' + d.days + ' 天自动轮换随机密码') : '已关闭定期轮换', true);
    }).catch(function (e) {
      $('#rot-save').disabled = false;
      toast('保存失败: ' + e.message, false);
    });
  };

  // ---------- 凭据编辑 ----------
  window.editCred = function (workerId) {
    var w = workers.find(function (x) { return x.id === workerId; });
    if (!w) return;
    $('#dlg-node').textContent = w.name + ' (' + (w.ip || 'IP 未知') + ')';
    $('#f-user').value = 'root';
    $('#f-pass').value = '';
    $('#f-port').value = 22;
    $('#f-err').className = 'err';
    $('#mask').classList.add('show');
    setTimeout(function () { $('#f-pass').focus(); }, 50);
    window.__editing = workerId;
  };
  window.closeDlg = function () { $('#mask').classList.remove('show'); };
  window.submitCred = function () {
    var btn = $('#f-ok');
    var user = $('#f-user').value.trim();
    var pass = $('#f-pass').value;
    var port = parseInt($('#f-port').value, 10) || 22;
    if (!user || !pass) {
      var err = $('#f-err');
      err.className = 'err show';
      err.textContent = '请填写用户名和密码';
      return;
    }
    btn.disabled = true; btn.textContent = '验证中…';
    api('/v2/ssh-gw/credentials/' + window.__editing, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass, port: port })
    }).then(function (j) {
      btn.disabled = false; btn.textContent = '验证并保存';
      if (j.ok) {
        closeDlg();
        toast('凭据已验证并保存', true);
        loadCreds();
      } else {
        var err = $('#f-err');
        err.className = 'err show';
        err.textContent = j.message || (j.code === 'unreachable' ? '端口不通, 请检查 sshd/端口/防火墙' : '用户名或密码错误');
        $('#f-pass').select();
      }
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = '验证并保存';
      var err = $('#f-err');
      err.className = 'err show';
      err.textContent = e.message;
    });
  };

  window.delCred = function (workerId, name) {
    if (!confirm('删除节点「' + name + '」的 SSH 凭据? 删除后终端连接需重新录入。')) return;
    api('/v2/ssh-gw/credentials/' + workerId, { method: 'DELETE' })
      .then(function () { toast('已删除', true); loadCreds(); })
      .catch(function (e) { toast('删除失败: ' + e.message, false); });
  };

  // init
  loadWorkers().then(loadCreds).catch(function () { loadCreds(); });
})();
</script>
</body>
</html>
