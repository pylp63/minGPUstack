# GPUStack 外部监控接入 (现场自定义)
#
# 二开变更: 不再内置 Prometheus / Grafana。GPUStack 指标端点为标准
# Prometheus 文本格式, 任何远程监控系统均可直接采集:
#
#   - server 指标:  http://<gpustack-host>:10161/metrics
#   - worker 指标:  http://<worker-host>:10151/metrics
#     (GPUStack 自有指标前缀 gpustack:worker_node_* — GPU 利用率/显存/
#      温度/功耗/文件系统等; 端口可由 metrics_port / worker_metrics_port 配置)
#
# 现场示例 (夜莺监控 n9e):
#   1. 夜莺服务端部署 categraf 或 prometheus agent
#   2. 采集配置指向上述 /metrics 端点 (内网直连即可)
#   3. 夜莺内置 prometheus 告警规则可直接使用 gpustack:* 指标
#
# 集群部署 (分布式) 时每个 worker 节点都暴露 :10151/metrics。

services:
  gpustack-server:
    image: ${IMAGE_REGISTRY:-docker.io}/${GPUSTACK_IMAGE_NAMESPACE:-gpustack}/gpustack:${GPUSTACK_TAG:-latest}
    container_name: gpustack-server
    restart: unless-stopped
    environment:
      - GPUSTACK_DISABLE_BUILTIN_OBSERVABILITY=true
    volumes:
      - gpustack-data:/var/lib/gpustack
    ports:
      - "80:80"
      - "10161:10161"

volumes:
  gpustack-data: {}
